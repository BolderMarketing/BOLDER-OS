# Render blueprint — one-click hosted BOLDER OS.
# In the Render dashboard: New > Blueprint > connect this repo > pick the branch.
# Runs in DEMO MODE (no database needed) so the live URL works immediately.
#
# To switch to your real Supabase DB, in the service's Environment tab:
#   1. Set DEMO_MODE = false
#   2. Add SUPABASE_URL and SUPABASE_SERVICE_KEY (from Supabase > Settings > API)
#   3. Add ADMIN_EMAIL and ADMIN_PASSWORD — on the next deploy the app creates
#      your login and seeds your clients automatically (only on an empty DB).
# (Make sure you've run supabase/schema.sql in the Supabase SQL editor first.)
services:
  - type: web
    name: bolder-os
    runtime: node
    plan: free
    branch: claude/exciting-hawking-qveric
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
